<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 450" role="img" aria-labelledby="title desc">
  <title id="title">Embedded ANC hardware and processing rates</title>
  <desc id="desc">Reference and error INMP441 microphones feed 48 kHz PCM24 audio through I2S and DMA into STM32F446RE. Sample-rate conversion surrounds a time-domain 8 kHz FxLMS controller. Output returns to 48 kHz for PCM5102, TDA2030, and a control loudspeaker. Microphones and DAC share an audio clock.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 1L7 4.5L0 8" fill="none" stroke="#66e6bf" stroke-width="1.5"/></marker></defs>
  <rect width="1120" height="450" fill="#11151b"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="36" y="39" fill="#66e6bf" font-size="15" letter-spacing="2">HARDWARE ARCHITECTURE</text>
    <text x="36" y="70" fill="#a3abb2" font-size="17">48 kHz I2S audio · shared microphone / DAC clock · 1 ms DMA blocks</text>
    <g fill="#151a21" stroke="#53616b" stroke-width="1.2">
      <rect x="36" y="130" width="195" height="90" rx="4"/>
      <rect x="36" y="270" width="195" height="90" rx="4"/>
      <rect x="285" y="112" width="370" height="266" rx="4"/>
      <rect x="710" y="200" width="150" height="90" rx="4"/>
      <rect x="914" y="200" width="170" height="90" rx="4"/>
    </g>
    <g fill="#f2f4ef" font-size="22" font-weight="600" text-anchor="middle">
      <text x="133" y="165">REF microphone</text><text x="133" y="305">ERR microphone</text>
      <text x="470" y="149">STM32F446RE</text><text x="785" y="235">PCM5102</text><text x="999" y="235">TDA2030</text>
    </g>
    <g fill="#a3abb2" font-size="16" text-anchor="middle">
      <text x="133" y="194">INMP441 · PCM24</text><text x="133" y="334">INMP441 · PCM24</text>
      <text x="470" y="176">NUCLEO-F446RE · C firmware</text><text x="785" y="263">48 kHz I2S DAC</text><text x="999" y="263">Power amplifier</text>
      <text x="470" y="345">48 kHz output · interpolate ×6 + filter</text>
      <text x="470" y="209">48 kHz input · filter + decimate ÷6</text>
      <text x="999" y="361">Control loudspeaker</text>
      <text x="36" y="420" text-anchor="start">I2S and DMA keep the 48 kHz transport running around the 8 kHz processing chain.</text>
    </g>
    <rect x="309" y="230" width="322" height="83" rx="4" fill="#11151b" stroke="#66e6bf" stroke-width="1.2"/>
    <text x="470" y="262" fill="#f2f4ef" font-size="23" font-weight="600" text-anchor="middle">Time-domain FxLMS · 8 kHz</text>
    <text x="470" y="290" fill="#a3abb2" font-size="16" text-anchor="middle">G · F · W · direct block adaptation</text>
    <g fill="none" stroke="#66e6bf" stroke-width="2" marker-end="url(#arrow)"><path d="M231 175H273"/><path d="M231 315H273"/><path d="M655 245H698"/><path d="M860 245H902"/><path d="M999 290V315"/></g>
    <path d="M981 320H991L1006 308V348L991 336H981Z" fill="none" stroke="#66e6bf" stroke-width="2"/>
    <path d="M1016 317Q1028 328 1016 339" fill="none" stroke="#66e6bf" stroke-width="2"/>
  </g>
</svg>
