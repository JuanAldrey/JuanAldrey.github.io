<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 410" role="img" aria-labelledby="title desc">
  <title id="title">Embedded ANC system architecture</title>
  <desc id="desc">Reference and error INMP441 microphones connect to an STM32F446RE running FxLMS and acoustic feedback compensation. Output passes through a PCM5102 DAC and TDA2030 amplifier to the control loudspeaker. Microphones and DAC share the audio clock.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 1L7 4.5L0 8" fill="none" stroke="#66e6bf" stroke-width="1.5"/></marker></defs>
  <rect width="1120" height="410" fill="#11151b"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="36" y="42" fill="#66e6bf" font-size="15" letter-spacing="2">SYSTEM ARCHITECTURE</text>
    <g fill="#151a21" stroke="#53616b" stroke-width="1.2">
      <rect x="36" y="94" width="195" height="90" rx="4"/>
      <rect x="36" y="242" width="195" height="90" rx="4"/>
      <rect x="285" y="94" width="370" height="238" rx="4"/>
      <rect x="710" y="168" width="150" height="90" rx="4"/>
      <rect x="914" y="168" width="170" height="90" rx="4"/>
    </g>
    <g fill="#f2f4ef" font-size="22" font-weight="600" text-anchor="middle">
      <text x="133" y="130">REF microphone</text><text x="133" y="278">ERR microphone</text>
      <text x="470" y="132">STM32F446RE</text><text x="785" y="203">PCM5102</text><text x="999" y="203">TDA2030</text>
    </g>
    <g fill="#a3abb2" font-size="16" text-anchor="middle">
      <text x="133" y="159">INMP441</text><text x="133" y="307">INMP441</text>
      <text x="470" y="160">NUCLEO-F446RE · C firmware</text><text x="785" y="232">I2S DAC</text><text x="999" y="232">Power amplifier</text>
      <text x="470" y="306">I2S · circular DMA</text><text x="999" y="357">Control loudspeaker</text>
    </g>
    <rect x="309" y="185" width="322" height="83" rx="4" fill="#11151b" stroke="#66e6bf" stroke-width="1.2"/>
    <text x="470" y="219" fill="#f2f4ef" font-size="24" font-weight="600" text-anchor="middle">Feedforward FxLMS</text>
    <text x="470" y="247" fill="#a3abb2" font-size="16" text-anchor="middle">Acoustic feedback compensation</text>
    <g fill="none" stroke="#66e6bf" stroke-width="2" marker-end="url(#arrow)"><path d="M231 139H273"/><path d="M231 287H273"/><path d="M655 213H698"/><path d="M860 213H902"/><path d="M999 258V284"/></g>
    <path transform="translate(0 25)" d="M981 288H991L1006 276V316L991 304H981Z" fill="none" stroke="#66e6bf" stroke-width="2"/>
    <path transform="translate(0 25)" d="M1016 285Q1028 296 1016 307" fill="none" stroke="#66e6bf" stroke-width="2"/>
    <text x="36" y="382" fill="#a3abb2" font-size="16">Microphones and DAC share the audio clock.</text>
  </g>
</svg>
