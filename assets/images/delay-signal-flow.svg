<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">Digital delay signal flow</title><desc id="desc">Dry and wet signal paths with repeats feedback and separate supply rails.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#66e6bf"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#e8ecee;font-size:17px}.muted{fill:#a0a9ae;font-size:14px}.accent{fill:#66e6bf;font-size:14px;letter-spacing:1px}.box{fill:#151d22;stroke:#38484d;stroke-width:1.5}.line{fill:none;stroke:#66e6bf;stroke-width:2;marker-end:url(#arrow)}</style>
<rect x="26" y="24" width="908" height="76" rx="8" class="box"/><text x="48" y="52" class="accent">POWER SUPPLY · EXTERNAL 9 V</text><text x="48" y="79">9 V → analog stages</text><text x="342" y="79">5 V regulator → PT2399</text><text x="661" y="79">4.5 V bias → op-amps</text>
<path class="line" d="M26 240H72"/><text x="26" y="220" class="muted">IN</text><rect class="box" x="72" y="204" width="142" height="72" rx="8"/><text x="143" y="235" text-anchor="middle">Input buffer</text><text x="143" y="257" text-anchor="middle" class="muted">DC blocking</text>
<path class="line" d="M214 240H277"/><path class="line" d="M238 240V153H839V204"/><text x="470" y="141" class="accent">DRY SIGNAL</text>
<rect class="box" x="277" y="193" width="255" height="94" rx="8"/><text x="404" y="224" text-anchor="middle">PT2399 delay</text><text x="404" y="249" text-anchor="middle" class="muted">Input + output filtering</text><text x="404" y="272" text-anchor="middle" class="accent">DELAY TIME</text>
<path class="line" d="M532 240H595"/><rect class="box" x="595" y="204" width="148" height="72" rx="8"/><text x="669" y="235" text-anchor="middle">Tone control</text><text x="669" y="257" text-anchor="middle" class="muted">Bass + treble</text>
<path class="line" d="M743 240H803"/><text x="770" y="220" text-anchor="middle" class="accent">LEVEL</text><circle cx="839" cy="240" r="36" class="box"/><text x="839" y="247" text-anchor="middle" font-size="26">+</text><text x="839" y="300" text-anchor="middle" class="muted">Output summer</text><path class="line" d="M875 240H930"/><text x="909" y="220" class="muted">OUT</text>
<circle cx="561" cy="240" r="4" fill="#66e6bf"/><circle cx="238" cy="240" r="4" fill="#66e6bf"/><path class="line" d="M561 240V351H252V255H277"/><text x="405" y="340" text-anchor="middle" class="accent">REPEATS · FEEDBACK</text><text x="620" y="350" class="muted">WET SIGNAL</text>
</svg>